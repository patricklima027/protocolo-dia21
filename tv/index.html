<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Treino na TV · Protocolo Dia 21</title>
<style>
:root{--g:#101114;--g2:#1B1D22;--g3:#2A2D34;--sol:#FF5A1F;--mare:#0F6E78;--areia:#F6F0E6;--t:#F4F1EA;--t2:#B9BBC1;--ok:#1E7B4C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--g);color:var(--t);font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{min-height:100%;display:flex;flex-direction:column}
.cond{font-family:"Avenir Next Condensed","Arial Narrow",Arial,sans-serif}
/* menu */
.menu-w{max-width:1180px;width:100%;margin:0 auto;padding:4vh 4vw 6vh}
.logo{display:flex;align-items:baseline;gap:14px;margin-bottom:.6vh}
.logo b{font:800 clamp(34px,5.2vw,66px)/1 "Avenir Next Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.logo span{color:var(--sol);font:800 clamp(14px,1.6vw,22px) "Avenir Next Condensed",Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase}
.sub{color:var(--t2);font-size:clamp(15px,1.7vw,24px);margin:0 0 3vh}
h2.s{font:800 clamp(14px,1.4vw,20px) "Avenir Next Condensed",Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--sol);margin:3vh 0 1.2vh}
.sem{display:flex;gap:1.2vw;flex-wrap:wrap}
.sem button{background:var(--g2);border:2px solid var(--g3);border-radius:14px;padding:1.2vh 1.6vw;min-width:7vw;font-size:clamp(16px,1.9vw,28px);font-weight:700;text-align:center}
.sem button small{display:block;font-weight:500;font-size:.55em;color:var(--t2);margin-top:2px}
.sem button.on{background:var(--sol);border-color:var(--sol);color:#fff}.sem button.on small{color:#FFE3D5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.4vw}
.card{background:var(--g2);border:2px solid var(--g3);border-radius:16px;padding:2vh 1.4vw;text-align:left}
.card:hover,.card:focus-visible,.sem button:hover,.sem button:focus-visible{border-color:var(--sol);outline:none}
.card b{display:block;font:800 clamp(20px,2.3vw,32px)/1.1 "Avenir Next Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase}
.card span{display:block;color:var(--t2);font-size:clamp(13px,1.3vw,18px);margin-top:.6vh}
.card em{display:block;font-style:normal;color:var(--sol);font-weight:700;margin-top:1vh;font-size:clamp(13px,1.4vw,19px)}
.opt{display:flex;align-items:center;gap:12px;margin-top:3vh;color:var(--t2);font-size:clamp(14px,1.5vw,21px)}
.opt input{width:1.5em;height:1.5em;accent-color:var(--sol)}
.dica-box{background:var(--g2);border-left:6px solid var(--mare);border-radius:10px;padding:1.6vh 1.6vw;margin-top:3vh;color:var(--t2);font-size:clamp(13px,1.4vw,19px);line-height:1.5}
.dica-box b{color:var(--t)}
/* treino */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2vh 3vw 0;font-size:clamp(14px,1.6vw,22px);color:var(--t2)}
.chip{background:var(--g2);border:2px solid var(--g3);border-radius:99px;padding:.5vh 1.2vw;font-weight:700;color:var(--t)}
.top .menu{background:transparent;color:var(--t2);font-size:inherit;padding:.5vh 1vw;border:2px solid var(--g3);border-radius:99px}
.main{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:3vw;align-items:center;padding:1vh 3vw}
.figcard{background:var(--areia);border-radius:26px;padding:2.4vh 2vw;display:flex;align-items:center;justify-content:center;min-height:42vh}
.figcard svg{width:100%;height:auto;max-height:58vh;display:block}
.info .n{font:800 clamp(34px,5vw,72px)/1 "Avenir Next Condensed",Arial,sans-serif;color:var(--sol)}
.info h1{font:800 clamp(34px,5.6vw,84px)/1 "Avenir Next Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;margin:.4vh 0 1vh;letter-spacing:-.005em}
.info .alt{color:var(--t2);font-size:clamp(15px,1.8vw,26px);margin:0 0 2.2vh}
.chips{display:flex;flex-wrap:wrap;gap:1vw;margin-bottom:2.2vh}
.chips span{background:var(--g2);border:2px solid var(--g3);border-radius:14px;padding:1vh 1.3vw;font-size:clamp(16px,2vw,30px);font-weight:700}
.chips .big{background:var(--sol);border-color:var(--sol);color:#fff}
.chips .rir{background:var(--mare);border-color:var(--mare);color:#fff}
.info .dica{font-size:clamp(16px,2vw,29px);line-height:1.35;margin:0 0 1.4vh}
.info .video{display:inline-block;color:#9FD6DC;font-size:clamp(13px,1.5vw,21px);margin:0 1vw .6vh 0}
.info .par{display:inline-block;background:#3A2415;color:#FFB48C;border-radius:10px;padding:.8vh 1.2vw;font-size:clamp(13px,1.5vw,21px);font-weight:700;margin-top:1vh}
.bar{display:flex;gap:6px;padding:0 3vw 1.4vh}
.bar i{flex:1;height:10px;border-radius:5px;background:var(--g3)}.bar i.f{background:var(--sol)}.bar i.a{background:#fff}
.btns{display:flex;gap:1.6vw;padding:0 3vw 3vh}
.btns button{background:var(--g2);border:2px solid var(--g3);border-radius:18px;padding:2vh 2vw;font-size:clamp(16px,2vw,30px);font-weight:700;flex:0 0 auto}
.btns .primario{flex:1;background:var(--sol);border-color:var(--sol);color:#fff;font-size:clamp(20px,2.8vw,42px)}
.btns button:hover,.btns button:focus-visible{border-color:#fff;outline:none}
.hint{padding:0 3vw 2vh;color:#6F727A;font-size:clamp(11px,1.1vw,15px);text-align:center}
/* descanso */
.rest{position:fixed;inset:0;background:rgba(16,17,20,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5;padding:3vh 4vw}
.rest .lab{font:800 clamp(16px,2vw,28px) "Avenir Next Condensed",Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--sol)}
.ring{position:relative;width:min(46vh,40vw);height:min(46vh,40vw);margin:2vh 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 min(15vh,13vw) "Avenir Next Condensed",Arial,sans-serif;font-variant-numeric:tabular-nums}
.rest .prox{color:var(--t2);font-size:clamp(15px,1.9vw,28px)}
.rest .prox b{display:block;color:var(--t);font:800 clamp(26px,4vw,56px)/1.1 "Avenir Next Condensed",Arial,sans-serif;text-transform:uppercase;margin-top:.6vh}
.rest .btns{padding:3vh 0 0;justify-content:center}
.rest .btns .primario{flex:0 1 auto}
.fim{margin:auto;text-align:center;padding:6vh 4vw;max-width:900px}
.fim h1{font:800 clamp(40px,7vw,100px)/1 "Avenir Next Condensed",Arial,sans-serif;text-transform:uppercase;margin:0 0 2vh}
.fim p{font-size:clamp(16px,2vw,28px);color:var(--t2);line-height:1.45}
.fim .btns{justify-content:center;padding-top:4vh}
@media (max-aspect-ratio:1/1){.main{grid-template-columns:1fr;gap:2vh}.figcard{min-height:30vh}.figcard svg{max-height:34vh}.info h1{font-size:clamp(30px,9vw,60px)}.chips span{font-size:clamp(14px,4vw,24px)}.btns{flex-wrap:wrap}.btns .primario{flex:1 1 100%;order:-1}.ring{width:min(60vw,36vh);height:min(60vw,36vh)}}
</style>
</head>
<body>
<div id="app"></div>
<script>/* Motor de figuras do Protocolo Dia 21 — bonecos de exercício em vista lateral (e frontal).
   Uma única fonte para: figuras do PDF, cartões PNG e animação do "Treino na TV".
   Convenções: x → direita, y ↓; ângulos em graus a partir da vertical para cima, sentido horário
   (0 = cima, 90 = direita/frente, 180 = baixo, 270 = esquerda/trás). O boneco olha para a direita. */
(function (root) {
  var COR = { g: '#17181B', cinza: '#A9ADB5', sol: '#FF5A1F', eq: '#5B6270', placa: '#0F6E78', banco: '#DDD3C1', chao: '#D2CAB8' };
  var L = { coxa: 42, canela: 42, pe: 15, tronco: 54, pescoco: 5, cabeca: 8.5, braco: 30, antebraco: 28 };

  function dir(a) { var r = a * Math.PI / 180; return [Math.sin(r), -Math.cos(r)]; }
  function add(p, d, l) { return [p[0] + d[0] * l, p[1] + d[1] * l]; }
  function ik(p0, p2, l1, l2, lado) {                       // articulação (joelho/cotovelo) entre dois pontos
    var dx = p2[0] - p0[0], dy = p2[1] - p0[1], dist = Math.hypot(dx, dy) || 1e-6;
    var d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(dist, l1 + l2 - 0.01));
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / dist, uy = dy / dist, px = p0[0] + ux * a, py = p0[1] + uy * a;
    return [px + (-uy) * lado * h, py + ux * lado * h];
  }

  /* pose: {H:[x,y] quadril | S:[x,y] ombro,  A:[x,y] tornozelo,  tr:ângulo do tronco,  cb:ângulo da cabeça,
            W:[x,y] punho (IK) ou ua/fa (ângulos), cot:+1/-1 lado do cotovelo, A2:[x,y] tornozelo de trás,
            pe:ângulo do pé, hl:[segmentos destacados], W2:[x,y] punho do braço de apoio} */
  function esqueleto(P) {
    var H = P.H, S = P.S;
    if (!H) H = add(S, dir(P.tr), -L.tronco);               // quadril a partir do ombro
    if (!S) S = add(H, dir(P.tr), L.tronco);
    var A = P.A, K = ik(H, A, L.coxa, L.canela, P.jo == null ? -1 : P.jo);
    var T = add(A, dir(P.pe == null ? 90 : P.pe), L.pe);
    var N = add(S, dir(P.cb == null ? P.tr : P.cb), L.pescoco), Cb = add(N, dir(P.cb == null ? P.tr : P.cb), L.cabeca);
    var E, W;
    if (P.W) { W = P.W; E = ik(S, W, L.braco, L.antebraco, P.cot == null ? 1 : P.cot); }
    else { E = add(S, dir(P.ua == null ? 180 : P.ua), L.braco); W = add(E, dir(P.fa == null ? 180 : P.fa), L.antebraco); }
    var sk = { H: H, S: S, A: A, K: K, T: T, N: N, C: Cb, E: E, W: W };
    if (P.A2) { sk.A2 = P.A2; sk.K2 = ik(H, P.A2, L.coxa, L.canela, P.jo == null ? -1 : P.jo); sk.T2 = add(P.A2, dir(P.pe2 == null ? 90 : P.pe2), L.pe); }
    if (P.W2) { sk.W2 = P.W2; sk.E2 = ik(S, P.W2, L.braco, L.antebraco, P.cot2 == null ? 1 : P.cot2); }
    return sk;
  }

  function seg(p, q, w, cor) { return '<line x1="' + p[0].toFixed(1) + '" y1="' + p[1].toFixed(1) + '" x2="' + q[0].toFixed(1) + '" y2="' + q[1].toFixed(1) + '" stroke="' + cor + '" stroke-width="' + w + '" stroke-linecap="round"/>'; }
  function circ(c, r, cor, ex) { return '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="' + r + '" fill="' + cor + '" ' + (ex || '') + '/>'; }

  function desenho(P, sk, props) {
    var hl = P.hl || [], cor = function (n, base) { return hl.indexOf(n) >= 0 ? COR.sol : base; };
    var s = '';
    if (props && props.antes) s += props.antes;
    if (sk.A2) s += seg(sk.H, sk.K2, 8, COR.cinza) + seg(sk.K2, sk.A2, 7, COR.cinza) + seg(sk.A2, sk.T2, 6, COR.cinza);
    if (sk.W2) s += seg(sk.S, sk.E2, 6, COR.cinza) + seg(sk.E2, sk.W2, 5.5, COR.cinza);
    s += seg(sk.A, sk.T, 6, COR.g);
    s += seg(sk.K, sk.A, 7.5, cor('canela', COR.g)) + seg(sk.H, sk.K, 9, cor('coxa', COR.g));
    s += seg(sk.H, sk.S, 13, cor('tronco', COR.g));
    s += seg(sk.S, sk.E, 6.5, cor('braco', COR.g)) + seg(sk.E, sk.W, 5.8, cor('antebraco', COR.g));
    s += seg(sk.S, sk.N, 5, COR.g) + circ(sk.C, 8.5, COR.g);
    if (props && props.depois) s += props.depois;
    return s;
  }

  function placa(c, r) { return circ(c, r, COR.placa) + circ(c, r * 0.35, '#fff', 'opacity=".9"'); }
  function banco(x1, y1, x2, y2, chao) {                      // assento do banco com pés
    return '<rect x="' + Math.min(x1, x2) + '" y="' + Math.min(y1, y2) + '" width="' + Math.abs(x2 - x1) + '" height="6" rx="2" fill="' + COR.banco + '"/>' +
      seg([x1 + 6, y1 + 6], [x1 + 6, chao], 3, COR.banco) + seg([x2 - 6, y1 + 6], [x2 - 6, chao], 3, COR.banco);
  }
  function linhaFina(p, q, cor, w, dash) { return '<line x1="' + p[0].toFixed(1) + '" y1="' + p[1].toFixed(1) + '" x2="' + q[0].toFixed(1) + '" y2="' + q[1].toFixed(1) + '" stroke="' + cor + '" stroke-width="' + (w || 1.6) + '" stroke-linecap="round" ' + (dash ? 'stroke-dasharray="3 3"' : '') + '/>'; }

  /* --------- exercícios: {nome, mus (músculos), a, b (poses), rot:[início, fim], props(sk,fase)} --------- */
  var EX = {};
  var ST = { x0: 0 };                                          // tornozelo em (0,0): o chão fica em y≈+4

  EX.agachamento = {
    nome: 'Agachamento', mus: 'coxas e glúteos', rot: ['Em pé', 'Desça e suba'],
    a: { A: [0, 0], H: [-2, -84], tr: 3, cb: 3, ua: 215, fa: 325, hl: ['coxa'] },
    b: { A: [0, 0], H: [-22, -50], tr: 42, cb: 30, ua: 225, fa: 335, hl: ['coxa'] },
    props: function (sk) { return { depois: placa([sk.S[0] - 5, sk.S[1] - 3], 9) }; }
  };
  EX.goblet = {
    nome: 'Agachamento goblet', mus: 'coxas e glúteos', rot: ['Em pé', 'Desça e suba'],
    a: { A: [0, 0], H: [-2, -84], tr: 2, cb: 2, W: [20, -92], cot: -1, hl: ['coxa'] },
    b: { A: [0, 0], H: [-20, -52], tr: 22, cb: 12, W: [26, -84], cot: -1, hl: ['coxa'] },
    props: function (sk) { return { depois: placa(sk.W, 7) }; }
  };
  EX.stiff = {
    nome: 'Stiff (terra romeno)', mus: 'posteriores de coxa e glúteos', rot: ['Em pé', 'Quadril para trás'],
    a: { A: [0, 0], H: [-2, -84], tr: 2, cb: 2, ua: 185, fa: 180, hl: ['coxa', 'tronco'] },
    b: { A: [0, 0], H: [-20, -74], tr: 78, cb: 70, ua: 182, fa: 180, hl: ['coxa', 'tronco'] },
    props: function (sk) { return { depois: placa(sk.W, 9) }; }
  };
  EX.supino = {
    nome: 'Supino reto', mus: 'peito, ombros e tríceps', rot: ['Barra no peito', 'Empurre para cima'],
    a: { A: [42, 0], H: [4, -50], tr: 270, cb: 270, ua: 168, fa: 4, A2: null, hl: ['braco', 'antebraco'] },
    b: { A: [42, 0], H: [4, -50], tr: 270, cb: 270, ua: 2, fa: 0, hl: ['braco', 'antebraco'] },
    props: function (sk) { return { antes: banco(-70, -46, 16, -46, 4), depois: placa(sk.W, 10) }; }
  };
  EX.supino_inclinado = {
    nome: 'Supino inclinado com halteres', mus: 'parte alta do peito e ombros', rot: ['Halteres no peito', 'Empurre para cima'],
    a: { A: [42, 0], H: [6, -52], tr: 300, cb: 300, ua: 165, fa: 355, hl: ['braco', 'antebraco'] },
    b: { A: [42, 0], H: [6, -52], tr: 300, cb: 300, ua: 3, fa: 0, hl: ['braco', 'antebraco'] },
    props: function (sk) { return { antes: '<polygon points="-62,-70 -12,-44 16,-44 16,-38 -62,-62" fill="' + COR.banco + '"/>' + seg([-34, -50], [-34, 4], 3, COR.banco) + seg([10, -38], [10, 4], 3, COR.banco), depois: placa(sk.W, 7) }; }
  };
  EX.remada_curvada = {
    nome: 'Remada curvada', mus: 'costas e bíceps', rot: ['Braços estendidos', 'Puxe a barra ao abdômen'],
    a: { A: [0, 0], H: [-26, -76], tr: 72, cb: 60, ua: 182, fa: 180, hl: ['braco', 'antebraco', 'tronco'] },
    b: { A: [0, 0], H: [-26, -76], tr: 72, cb: 60, ua: 244, fa: 188, hl: ['braco', 'antebraco', 'tronco'] },
    props: function (sk) { return { depois: placa(sk.W, 9) }; }
  };
  EX.remada_unilateral = {
    nome: 'Remada unilateral', mus: 'costas e bíceps', rot: ['Braço estendido', 'Puxe o halter'],
    a: { A: [0, 0], H: [-28, -72], tr: 80, cb: 66, ua: 182, fa: 180, W2: [36, -58], cot2: 1, hl: ['braco', 'antebraco', 'tronco'] },
    b: { A: [0, 0], H: [-28, -72], tr: 80, cb: 66, ua: 246, fa: 190, W2: [36, -58], cot2: 1, hl: ['braco', 'antebraco', 'tronco'] },
    props: function (sk) { return { antes: '<rect x="30" y="-58" width="34" height="6" rx="2" fill="' + COR.banco + '"/>' + seg([36, -52], [36, 4], 3, COR.banco) + seg([60, -52], [60, 4], 3, COR.banco), depois: placa(sk.W, 7) }; }
  };
  EX.desenvolvimento = {
    nome: 'Desenvolvimento com halteres', mus: 'ombros e tríceps', rot: ['Halteres nos ombros', 'Empurre para cima'],
    a: { A: [34, 0], H: [0, -50], tr: 356, cb: 356, ua: 178, fa: 6, hl: ['braco', 'antebraco'] },
    b: { A: [34, 0], H: [0, -50], tr: 356, cb: 356, ua: 3, fa: 0, hl: ['braco', 'antebraco'] },
    props: function (sk) { return { antes: banco(-14, -44, 20, -44, 4) + '<rect x="-16" y="-110" width="6" height="66" rx="3" fill="' + COR.banco + '"/>', depois: placa(sk.W, 7) }; }
  };
  EX.rosca = {
    nome: 'Rosca direta', mus: 'bíceps', rot: ['Braços estendidos', 'Dobre os cotovelos'],
    a: { A: [0, 0], H: [-2, -84], tr: 2, cb: 2, ua: 180, fa: 180, hl: ['braco', 'antebraco'] },
    b: { A: [0, 0], H: [-2, -84], tr: 2, cb: 2, ua: 180, fa: 28, hl: ['braco', 'antebraco'] },
    props: function (sk) { return { depois: placa(sk.W, 8) }; }
  };
  EX.triceps_polia = {
    nome: 'Tríceps na polia (corda)', mus: 'tríceps', rot: ['Cotovelos dobrados', 'Estenda os cotovelos'],
    a: { A: [0, 0], H: [-4, -84], tr: 8, cb: 8, ua: 176, fa: 34, hl: ['braco', 'antebraco'] },
    b: { A: [0, 0], H: [-4, -84], tr: 8, cb: 8, ua: 176, fa: 164, hl: ['braco', 'antebraco'] },
    props: function (sk) { var topo = [sk.S[0] + 18, sk.S[1] - 96]; return { antes: linhaFina(topo, sk.W, COR.eq, 1.4) + circ(topo, 4, COR.eq), depois: circ(sk.W, 3.5, COR.eq) }; }
  };
  EX.elevacao_pelvica = {
    nome: 'Elevação pélvica', mus: 'glúteos e posteriores', rot: ['Quadril baixo', 'Suba o quadril'],
    a: { S: [-50, -50], A: [40, 0], tr: 296, cb: 280, ua: 90, fa: 90, W: [-2, -34], hl: ['coxa', 'tronco'] },
    b: { S: [-50, -50], A: [40, 0], tr: 272, cb: 272, ua: 90, fa: 90, W: [-2, -52], hl: ['coxa', 'tronco'] },
    props: function (sk) { return { antes: '<rect x="-78" y="-46" width="38" height="6" rx="2" fill="' + COR.banco + '"/>' + seg([-72, -40], [-72, 4], 3, COR.banco) + seg([-46, -40], [-46, 4], 3, COR.banco) }; }
  };
  EX.panturrilha = {
    nome: 'Panturrilha em pé', mus: 'panturrilhas', rot: ['Calcanhar embaixo', 'Suba na ponta dos pés'],
    a: { A: [0, 0], H: [0, -83], tr: 0, cb: 0, ua: 180, fa: 180, pe: 90, hl: ['canela'] },
    b: { A: [0, -9], H: [0, -91], tr: 0, cb: 0, ua: 180, fa: 180, pe: 124, hl: ['canela'] },
    props: function () { return { antes: '<rect x="-14" y="4" width="46" height="8" rx="2" fill="' + COR.banco + '"/>' }; }
  };
  EX.prancha = {

": ""}, {"ex": "panturrilha_degrau", "series": "2 × 12–20", "descanso": "1 min", "flag": ""}, {"ex": "prancha", "series": "2 × 30–60 s", "descanso": "1 min", "flag": ""}]}, "C2": {"titulo": "Treino C2 · em casa", "plano": "Plano C · em casa (halteres, mochila ou elástico)", "itens": [{"ex": "afundo_bulgaro", "series": "3 × 8–12", "descanso": "2 min", "flag": ""}, {"ex": "stiff_halteres", "series": "3 × 8–12", "descanso": "2 min", "flag": ""}, {"ex": "flexao", "series": "3 × 6–15", "descanso": "2 min", "flag": ""}, {"ex": "remada_unilateral", "series": "3 × 8–12", "descanso": "2 min", "flag": ""}, {"ex": "elevacao_lateral", "series": "2 × 12–20", "descanso": "1 min", "flag": ""}, {"ex": "rosca", "series": "2 × 10–15", "descanso": "", "flag": "bi"}, {"ex": "triceps_testa_chao", "series": "2 × 8–15", "descanso": "1 min", "flag": "bi2"}, {"ex": "prancha", "series": "2 × 30–60 s", "descanso": "1 min", "flag": ""}]}}};</script>
<script>
(function(){

function bip(f,d){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function parseSer(txt){var m=/^(\d+)\s*×\s*(.+)$/.exec(txt);return{n:+m[1],rep:m[2].trim()}}
function parseDesc(t){if(!t)return 60;var nums=(t.match(/[\d,]+/g)||[]).map(function(x){return parseFloat(x.replace(",","."))});if(!nums.length)return 60;var mid=nums.length>1?(nums[0]+nums[1])/2:nums[0];return Math.round(mid*60/15)*15}
function nSeries(n){return (S.sem===1||S.menos)&&n>2?n-1:n}
function montar(chave){
  var sess=D.sessoes[chave],it=sess.itens,passos=[],i=0,total=it.length;
  var grupos=[];
  while(i<it.length){
    if(it[i].flag==="bi"&&it[i+1]&&it[i+1].flag==="bi2"){grupos.push([i,i+1]);i+=2}else{grupos.push([i]);i+=1}
  }
  grupos.forEach(function(g){
    var ns=g.map(function(k){return nSeries(parseSer(it[k].series).n)});
    var nmax=Math.max.apply(null,ns);
    var rest=parseDesc(it[g[g.length-1]].descanso||it[g[0]].descanso);
    for(var s=1;s<=nmax;s++){
      g.forEach(function(k,pos){
        if(s<=ns[pos]){var p=parseSer(it[k].series);passos.push({k:k,ex:it[k].ex,s:s,ns:ns[pos],rep:p.rep,hold:/\ss$/.test(p.rep),par:g.length>1?(pos===0?"inicio":"fim"):"",pos:g.length>1?pos:0,gfim:pos===g.length-1,rest:rest})}
      });
    }
  });
  return passos;
}
function estimar(chave){var ps=montar(chave),t=5*60;ps.forEach(function(p,j){t+=70;if(p.gfim&&j<ps.length-1)t+=p.rest});return Math.round(t/60/5)*5}

  });

  app.innerHTML=h;

  app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){iniciar(b.dataset.t)}});
}
function iniciar(c,pasInicial){

function ok(){
  if(S.tela==="aq"){S.i=0;return treino()}
  if(S.tela==="fim"){return voltarMenu()}
  if(S.tela==="descanso"){return fimDescanso()}
  var p=S.passos[S.i];
  if(p.hold){
    if(!S.hold){S.hold=Date.now();var b=$("#ok");b.textContent="Terminei ✓";b.dataset.t=1;return}
    S.hold=null;
  }
  var ultimo=S.i>=S.passos.length-1;
  if(ultimo){S.i++;return fim()}
  if(p.gfim)descanso(p.rest);else{S.i++;treino()}
}
function pular(){if(S.tela==="descanso")return fimDescanso();if(S.tela==="trabalho"){S.hold=null;S.i=Math.min(S.i+1,S.passos.length);treino()}}
function voltar(){if(S.tela==="descanso"){S.rest=null;return treino()}if(S.tela==="trabalho"&&S.i>0){S.hold=null;S.i--;treino()}else if(S.tela==="trabalho"&&S.i===0){aquecer()}}
function descanso(seg){
  S.tela="descanso";S.rest={total:seg,fim:Date.now()+seg*1000,ult:null,extra:0};
  var nxt=S.passos[S.i+1],ne=nomeEx(nxt);
  var h='<div class="rest"><div class="lab">Descanse</div><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#2A2D34" stroke-width="6"/><circle id="arco" cx="50" cy="50" r="45" fill="none" stroke="#FF5A1F" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg><div class="t" id="tempo">'+fmt(seg)+'</div></div>';
  h+='<div class="prox">Próximo<b>'+esc(ne.nome)+' · série '+nxt.s+' de '+nxt.ns+'</b></div><div class="btns"><button id="mais">+ 30 s</button><button class="primario" id="ok">Pular descanso ›</button><button id="volta">‹ Voltar</button></div></div>';
  app.insertAdjacentHTML("beforeend",h);
  $("#mais").onclick=maisTempo;$("#ok").onclick=fimDescanso;$("#volta").onclick=function(){var r=document.querySelector(".rest");if(r)r.remove();S.rest=null;treino()};
}
function maisTempo(){if(S.rest){S.rest.fim+=30000;S.rest.total+=30}}
function fimDescanso(){var r=document.querySelector(".rest");if(r)r.remove();S.rest=null;S.i++;treino()}
function fim(){
  S.tela="fim";var s=D.sessoes[S.t];
  app.innerHTML='<div class="fim"><h1>Treino feito</h1><p>'+esc(s.titulo)+', semana '+S.sem+'. Anote carga, repetições e RIR de cada série na planilha ou na folha do capítulo 15.</p><p>Se alguma série foi trapaceada, ela não conta para a progressão. <b>Treino curto ainda é treino.</b></p><div class="btns"><button class="primario" id="ok">Voltar ao menu</button></div></div>';
  $("#ok").onclick=voltarMenu;bip(880,.15);
}
/* ---------- relógio ---------- */
setInterval(function(){
  if(S.pausa)return;
  if(S.tela==="descanso"&&S.rest){
    var falta=(S.rest.fim-Date.now())/1000,tp=$("#tempo"),ar=$("#arco");
    if(tp)tp.textContent=fmt(falta);
    if(ar)ar.setAttribute("stroke-dashoffset",String(282.74*(1-Math.max(0,falta)/S.rest.total)));
    var c=Math.ceil(falta);
    if(c<=3&&c>=1&&S.rest.ult!==c){S.rest.ult=c;bip(c===1?1040:760,.12)}
    if(falta<=0){bip(1040,.35);fimDescanso()}
  }else if(S.tela==="trabalho"&&S.hold){
    var b=$("#ok");if(b){b.textContent="Terminei ✓ · "+fmt((Date.now()-S.hold)/1000)}
  }
},250);
document.addEventListener("keydown",function(ev){
  var k=ev.key;
  if(S.tela==="menu")return;
  if(k==="Enter"||k===" "){ev.preventDefault();ok()}
  else if(k==="ArrowRight")pular();
  else if(k==="ArrowLeft"||k==="Backspace")voltar();
  else if(k==="+"||k==="=")maisTempo();
  else if(k==="p"||k==="P"){S.pausa=!S.pausa;if(S.pausa&&S.rest)S.rest.pausadoEm=Date.now();else if(S.rest&&S.rest.pausadoEm){S.rest.fim+=Date.now()-S.rest.pausadoEm;S.rest.pausadoEm=null}}
  else if(k==="m"||k==="M"||k==="Escape")voltarMenu();
  else if(k==="f"||k==="F"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
});
/* link direto: #t=A&s=2&p=5 (p = passo; -1 = aquecimento) */
var q={};location.hash.replace(/^#/,"").split("&").forEach(function(x){var a=x.split("=");if(a[0])q[a[0]]=a[1]});
if(q.s)S.sem=Math.max(1,Math.min(6,+q.s||1));
if(q.m)S.menos=q.m==="1";
if(q.t&&D.sessoes[q.t]){iniciar(q.t,q.p==null?-1:+q.p);if(q.r&&S.tela==="trabalho"){var pp=S.passos[S.i];if(pp&&pp.gfim)descanso(pp.rest)}}else menu();
})();
</script>
</body>
</html>
